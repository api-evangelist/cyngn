aid: cyngn
name: Cyngn
description: >-
  Cyngn (NASDAQ: CYN) is a Mountain View, California autonomous vehicle
  technology company that develops and deploys industrial autonomous mobile
  robots (AMRs) for material handling. Its flagship DriveMod stack is a
  vehicle-agnostic, AI-powered autonomy system that retrofits onto standard
  industrial vehicles such as tuggers and forklifts, paired with the Cyngn
  Insight fleet-management, teleoperation, and analytics platform and the
  Cyngn Evolve data toolkit — together marketed as the Enterprise Autonomy
  Suite. Cyngn targets warehousing, manufacturing, and logistics operators
  facing labor shortages and safety challenges, and integrates with major
  warehouse management systems (Manhattan, Blue Yonder, SAP EWM). The company
  traces its corporate lineage to Cyanogen Inc. (the CyanogenMod company),
  whose dormant GitHub organization still links to cyngn.com.
